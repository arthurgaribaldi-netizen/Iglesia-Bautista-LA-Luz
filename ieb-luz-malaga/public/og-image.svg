<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Church Icon -->
  <g transform="translate(600, 200)">
    <path d="M-60,0 L-40,-40 L40,-40 L60,0 L60,80 L-60,80 Z" fill="white" opacity="0.9"/>
    <rect x="-50" y="20" width="20" height="60" fill="white" opacity="0.9"/>
    <rect x="30" y="20" width="20" height="60" fill="white" opacity="0.9"/>
    <rect x="-10" y="40" width="20" height="40" fill="white" opacity="0.9"/>
    <circle cx="0" cy="-50" r="15" fill="white" opacity="0.9"/>
    <rect x="-5" y="-65" width="10" height="15" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="350" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">
    IEB La Luz Málaga
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" opacity="0.9">
    Iglesia Evangélica Bautista
  </text>
  
  <!-- Tagline -->
  <text x="600" y="450" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" opacity="0.8">

version: 2
updates:
  # Atualizações para dependências do npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Arthur"
    assignees:
      - "Arthur"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    ignore:
      # Ignorar atualizações de versões major que podem quebrar
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Permitir atualizações de segurança mesmo em versões major
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # Atualizações para GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Arthur"
    assignees:
      - "Arthur"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "ci"

  # Atualizações para Docker (se usar)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "Arthur"
    assignees:
      - "Arthur"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "docker"
      - "infrastructure"
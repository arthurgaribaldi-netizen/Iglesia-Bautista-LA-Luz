name: Cleanup

on:
  schedule:
    # Executa limpeza diariamente às 2:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cleanup-runs:
    name: Cleanup Old Workflow Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = await github.rest.actions.listWorkflowsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            for (const workflow of workflows.data.workflows) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                status: 'completed',
                per_page: 100,
              });
              
              const oldRuns = runs.data.workflow_runs
                .filter(run => {
                  const runDate = new Date(run.created_at);
                  const thirtyDaysAgo = new Date();
                  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                  return runDate < thirtyDaysAgo;
                });
              
              for (const run of oldRuns) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  console.log(`Deleted old run: ${run.id}`);
                } catch (error) {
                  console.log(`Failed to delete run ${run.id}: ${error.message}`);
                }
              }
            }

  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            
            const oldArtifacts = artifacts.data.artifacts
              .filter(artifact => {
                const artifactDate = new Date(artifact.created_at);
                const sevenDaysAgo = new Date();
                sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                return artifactDate < sevenDaysAgo;
              });
            
            for (const artifact of oldArtifacts) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                console.log(`Deleted old artifact: ${artifact.name}`);
              } catch (error) {
                console.log(`Failed to delete artifact ${artifact.name}: ${error.message}`);
              }
            }

  cleanup-docker-images:
    name: Cleanup Old Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Docker images
        uses: actions/github-script@v7
        with:
          script: |
            const packages = await github.rest.packages.listPackagesForRepository({
              owner: context.repo.owner,
              repo: context.repo.repo,
              package_type: 'container',
            });
            
            for (const pkg of packages.data) {
              const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                package_type: 'container',
                package_name: pkg.name,
                org: context.repo.owner,
              });
              
              const oldVersions = versions.data
                .filter(version => {
                  const versionDate = new Date(version.created_at);
                  const thirtyDaysAgo = new Date();
                  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                  return versionDate < thirtyDaysAgo;
                });
              
              for (const version of oldVersions) {
                try {
                  await github.rest.packages.deletePackageVersionForOrg({
                    package_type: 'container',
                    package_name: pkg.name,
                    org: context.repo.owner,
                    package_version_id: version.id,
                  });
                  console.log(`Deleted old Docker image version: ${version.id}`);
                } catch (error) {
                  console.log(`Failed to delete version ${version.id}: ${error.message}`);
                }
              }
            }

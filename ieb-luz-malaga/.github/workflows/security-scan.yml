name: Security Scan

on:
  schedule:
    # Executa diariamente às 2h UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # Job de análise de dependências
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "## 🔒 NPM Security Audit" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate --json > audit-results.json || true
          
          # Verificar se há vulnerabilidades
          VULNERABILITIES=$(jq -r '.vulnerabilities | length' audit-results.json 2>/dev/null || echo "0")
          
          if [ "$VULNERABILITIES" -gt 0 ]; then
            echo "⚠️ **$VULNERABILITIES vulnerabilidades encontradas**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Detalhes das Vulnerabilidades:" >> $GITHUB_STEP_SUMMARY
            echo "```json" >> $GITHUB_STEP_SUMMARY
            jq '.vulnerabilities' audit-results.json >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Nenhuma vulnerabilidade encontrada**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

      - name: Upload audit results
        uses: actions/upload-artifact@v3
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30

  # Job de análise de código
  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security rules
        run: |
          echo "## 🔍 ESLint Security Analysis" >> $GITHUB_STEP_SUMMARY
          npx eslint src/ --ext .ts,.tsx,.js,.jsx --config .eslintrc.security.js || true

      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/xss
            p/sql-injection
            p/command-injection
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Install Semgrep CLI
        run: |
          pip install semgrep

      - name: Run Semgrep with SARIF output
        run: |
          semgrep --config=p/security-audit,p/secrets,p/xss,p/sql-injection,p/command-injection \
            --sarif --output=semgrep-results.sarif \
            src/
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep-results.sarif

  # Job de análise de secrets
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Job de análise de configuração
  config-scan:
    name: Configuration Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          echo "## 🔧 Configuration Security Check" >> $GITHUB_STEP_SUMMARY
          
          # Verificar se arquivos sensíveis não estão commitados
          SENSITIVE_FILES=(".env" ".env.local" ".env.production" "config.json" "secrets.json")
          FOUND_FILES=""
          
          for file in "${SENSITIVE_FILES[@]}"; do
            if [ -f "$file" ]; then
              FOUND_FILES="$FOUND_FILES\n- $file"
            fi
          done
          
          if [ -n "$FOUND_FILES" ]; then
            echo "⚠️ **Arquivos sensíveis encontrados no repositório:**" >> $GITHUB_STEP_SUMMARY
            echo -e "$FOUND_FILES" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Ação recomendada:** Remover estes arquivos do repositório e usar secrets do GitHub." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Nenhum arquivo sensível encontrado no repositório**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check environment variables usage
        run: |
          echo "### 🔍 Verificação de Variáveis de Ambiente" >> $GITHUB_STEP_SUMMARY
          
          # Verificar se há uso de process.env sem verificação
          ENV_USAGE=$(grep -r "process\.env\." src/ --include="*.ts" --include="*.tsx" | grep -v "process\.env\.NODE_ENV" || true)
          
          if [ -n "$ENV_USAGE" ]; then
            echo "**Uso de variáveis de ambiente encontrado:**" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            echo "$ENV_USAGE" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi

  # Job de análise de containers (se aplicável)
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'Dockerfile') || contains(github.event.head_commit.added, 'Dockerfile')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Job de notificação
  notify-security:
    name: Security Notifications
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, secrets-scan, config-scan]
    if: always()
    steps:
      - name: Notify on security issues
        if: failure()
        run: |
          echo "🚨 Security issues detected - notification sent to team"

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Security scan completed successfully - notification sent to team"

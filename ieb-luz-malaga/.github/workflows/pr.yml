name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]
  pull_request_target:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  # Job de validação básica
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false

      - name: Check PR size
        uses: actions/github-script@v6
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const changes = files.reduce((acc, file) => {
              acc.additions += file.additions;
              acc.deletions += file.deletions;
              acc.changes += file.changes;
              return acc;
            }, { additions: 0, deletions: 0, changes: 0 });
            
            console.log(`PR Stats: +${changes.additions} -${changes.deletions} ${changes.changes} changes`);
            
            // Alertar se o PR for muito grande
            if (changes.changes > 1000) {
              console.log('⚠️ Large PR detected - consider breaking it down');
            }

  # Job de qualidade de código
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check .

      - name: Comment PR with lint results
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const fs = require('fs');
            
            // Verificar se há erros de lint
            try {
              const lintOutput = fs.readFileSync('/tmp/lint-results.txt', 'utf8');
              if (lintOutput.includes('error')) {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `## 🔍 Lint Issues Found\n\n\`\`\`\n${lintOutput}\n\`\`\``
                });
              }
            } catch (error) {
              console.log('No lint results file found');
            }

  # Job de testes
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: pr-tests
          name: codecov-pr

      - name: Comment PR with test results
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const fs = require('fs');
            
            try {
              const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
              const summary = coverage.total;
              
              const coveragePercent = {
                lines: summary.lines.pct,
                functions: summary.functions.pct,
                branches: summary.branches.pct,
                statements: summary.statements.pct
              };
              
              const coverageEmoji = (percent) => {
                if (percent >= 90) return '🟢';
                if (percent >= 80) return '🟡';
                if (percent >= 70) return '🟠';
                return '🔴';
              };
              
              const comment = `## 📊 Test Coverage Report
              
              | Metric | Coverage | Status |
              |--------|----------|--------|
              | Lines | ${coveragePercent.lines}% | ${coverageEmoji(coveragePercent.lines)} |
              | Functions | ${coveragePercent.functions}% | ${coverageEmoji(coveragePercent.functions)} |
              | Branches | ${coveragePercent.branches}% | ${coverageEmoji(coveragePercent.branches)} |
              | Statements | ${coveragePercent.statements}% | ${coverageEmoji(coveragePercent.statements)} |
              
              **Threshold:** 80% (minimum required)`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not read coverage file');
            }

  # Job de build
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Analyze bundle size
        run: |
          echo "## 📦 Bundle Analysis" >> $GITHUB_STEP_SUMMARY
          du -sh .next/static/chunks/* | sort -hr | head -10 >> $GITHUB_STEP_SUMMARY

  # Job de preview deployment
  preview:
    name: Preview Deployment
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--yes'
          working-directory: ./

      - name: Comment PR with preview link
        uses: actions/github-script@v6
        with:
          script: |
            // Aguardar um pouco para o deploy completar
            await new Promise(resolve => setTimeout(resolve, 30000));
            
            const comment = `## 🚀 Preview Deployment
            
            ✅ **Deploy realizado com sucesso!**
            
            **Preview URL:** [Ver Preview](https://ieb-luz-malaga-git-${{ github.head_ref }}-vercel.vercel.app)
            
            ---
            *Este preview será atualizado automaticamente a cada push neste PR.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Job de análise de segurança
  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          echo "## 🔒 Security Audit" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  # Job de aprovação automática
  auto-approve:
    name: Auto Approve
    runs-on: ubuntu-latest
    needs: [validate, code-quality, test, build, security]
    if: github.actor == 'dependabot[bot]' && needs.validate.result == 'success'
    steps:
      - name: Auto approve Dependabot PR
        uses: hmarr/auto-approve-action@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

  # Job de merge automático
  auto-merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    needs: [validate, code-quality, test, build, security]
    if: github.event.pull_request.draft == false && github.actor == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

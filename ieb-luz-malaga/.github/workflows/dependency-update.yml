name: Dependency Update

on:
  schedule:
    # Executa toda segunda-feira às 9h UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # Job de verificação de dependências desatualizadas
  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated packages
        run: |
          echo "## 📦 Dependências Desatualizadas" >> $GITHUB_STEP_SUMMARY
          npm outdated --json > outdated.json || true
          
          if [ -s outdated.json ]; then
            echo "### 🔍 Análise de Dependências" >> $GITHUB_STEP_SUMMARY
            echo "Foram encontradas dependências que podem ser atualizadas:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "```json" >> $GITHUB_STEP_SUMMARY
            cat outdated.json >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Todas as dependências estão atualizadas!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Security audit
        run: |
          echo "## 🔒 Auditoria de Segurança" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate --json > audit.json || true
          
          if [ -s audit.json ]; then
            echo "### ⚠️ Vulnerabilidades Encontradas" >> $GITHUB_STEP_SUMMARY
            echo "```json" >> $GITHUB_STEP_SUMMARY
            cat audit.json >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Nenhuma vulnerabilidade encontrada!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v3
        with:
          name: dependency-audit
          path: |
            outdated.json
            audit.json
          retention-days: 30

  # Job de atualização automática de dependências menores
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    needs: check-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install dependencies
        run: npm ci

      - name: Update patch and minor versions
        run: |
          # Atualizar apenas versões patch e minor
          npx npm-check-updates -u --target minor
          npm install

      - name: Run tests after update
        run: |
          npm run test:ci
          npm run lint
          npm run build

      - name: Create Pull Request
        if: github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies (patch and minor versions)'
          title: '🔄 Atualização Automática de Dependências'
          body: |
            ## 🔄 Atualização Automática de Dependências
            
            Este PR foi criado automaticamente para atualizar dependências com versões patch e minor.
            
            ### 📋 O que foi atualizado:
            - Dependências com atualizações de patch (x.x.X)
            - Dependências com atualizações de minor (x.X.x)
            - Não inclui atualizações major (X.x.x) por segurança
            
            ### ✅ Verificações realizadas:
            - [x] Testes unitários passando
            - [x] Lint sem erros
            - [x] Build bem-sucedido
            
            ### 🔍 Próximos passos:
            - [ ] Revisar as mudanças
            - [ ] Testar localmente se necessário
            - [ ] Fazer merge quando aprovado
            
            ---
            *Este PR foi criado automaticamente pelo workflow de atualização de dependências.*
          branch: chore/update-dependencies
          delete-branch: true

  # Job de notificação
  notify-update:
    name: Notify Update
    runs-on: ubuntu-latest
    needs: [check-dependencies, update-dependencies]
    if: always()
    steps:
      - name: Download audit results
        uses: actions/download-artifact@v3
        with:
          name: dependency-audit
          path: ./audit-results

      - name: Create summary
        run: |
          echo "## 📊 Resumo da Atualização de Dependências" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.update-dependencies.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "./audit-results/outdated.json" ]; then
            echo "### 📦 Dependências Desatualizadas" >> $GITHUB_STEP_SUMMARY
            echo "```json" >> $GITHUB_STEP_SUMMARY
            cat ./audit-results/outdated.json >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./audit-results/audit.json" ]; then
            echo "### 🔒 Auditoria de Segurança" >> $GITHUB_STEP_SUMMARY
            echo "```json" >> $GITHUB_STEP_SUMMARY
            cat ./audit-results/audit.json >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ **Falha na Atualização de Dependências**
            
            O workflow de atualização automática de dependências falhou.
            Verifique os logs para mais detalhes.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
